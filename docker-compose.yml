services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  pooler:
    build:
      context: .
      dockerfile: apps/pooler/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    depends_on:
      redis:
        condition: service_healthy

  ws:
    build:
      context: .
      dockerfile: apps/ws/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:8080
    depends_on:
      - server
      - ws
