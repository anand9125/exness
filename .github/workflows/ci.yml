name: CI

on:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/ci.yml"
      - "apps/server/**"
      - "apps/ws/**"
      - "apps/pooler/**"
      - "apps/web/**"
      - "apps/**/Dockerfile"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
  pull_request:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/ci.yml"
      - "apps/server/**"
      - "apps/ws/**"
      - "apps/pooler/**"
      - "apps/web/**"
      - "apps/**/Dockerfile"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
  workflow_dispatch:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
