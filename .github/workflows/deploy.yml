name: Build and Deploy to Docker Hub + EC2

on:
  push:
    branches:
      - master
    paths:
      - "apps/server/**"
      - "apps/ws/**"
      - "apps/pooler/**"
      - "apps/web/**"
      - "apps/**/Dockerfile"
      - "packages/**"
      - "package-lock.json"
      - "turbo.json"
      - "docker-compose.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ---------- Pooler (price poller) ----------
      - name: Build & Push Pooler
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/pooler/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/exness-pooler:latest

      # ---------- Main Backend (REST API) ----------
      - name: Build & Push Server
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/server/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/exness-server:latest

      # ---------- WS Backend ----------
      - name: Build & Push WS
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/ws/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/exness-ws:latest

      # ---------- Frontend ----------
      - name: Build & Push Web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/exness-web:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Logging into Docker Hub..."
            docker login -u "${{ secrets.DOCKER_USERNAME }}" -p "${{ secrets.DOCKER_PASSWORD }}"

            echo "Ensuring Docker network exists..."
            docker network create exness-network || true

            echo "Pulling latest images..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/exness-server:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/exness-ws:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/exness-pooler:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/exness-web:latest
            docker pull redis:7-alpine

            echo "Stopping old containers..."
            docker stop exness-server || true
            docker rm exness-server || true
            docker stop exness-ws || true
            docker rm exness-ws || true
            docker stop exness-pooler || true
            docker rm exness-pooler || true
            docker stop exness-web || true
            docker rm exness-web || true
            docker stop exness-redis || true
            docker rm exness-redis || true

            echo "Starting Redis..."
            docker run -d \
              --name exness-redis \
              --network exness-network \
              redis:7-alpine

            echo "Starting Server (REST API)..."
            docker run -d \
              --name exness-server \
              --env-file ~/exness-deploy/.env.server \
              --network exness-network \
              -p 4000:4000 \
              ${{ secrets.DOCKER_USERNAME }}/exness-server:latest

            echo "Starting WS backend..."
            docker run -d \
              --name exness-ws \
              --env-file ~/exness-deploy/.env.ws \
              --network exness-network \
              -p 8080:8080 \
              ${{ secrets.DOCKER_USERNAME }}/exness-ws:latest

            echo "Starting pooler..."
            docker run -d \
              --name exness-pooler \
              --env-file ~/exness-deploy/.env.pooler \
              --network exness-network \
              ${{ secrets.DOCKER_USERNAME }}/exness-pooler:latest

            echo "Starting frontend..."
            docker run -d \
              --name exness-web \
              --network exness-network \
              -e NODE_ENV=production \
              -p 3000:3000 \
              ${{ secrets.DOCKER_USERNAME }}/exness-web:latest

            echo "Restarting nginx..."
            docker restart nginx || true

            echo "Deployment complete!"

